name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Test with race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Check installer syntax
        run: sh -n install.sh
